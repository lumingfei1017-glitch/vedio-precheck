[project]
name = "video-precheck"
version = "0.1.0"
description = "Qianchuan video material review MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "edge-tts>=7.0.0",
    "opencv-python-headless>=4.10,<5",
    "dashscope>=2.1.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "openpyxl>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
